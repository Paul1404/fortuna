document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"2fcb4e75-c116-43d9-b662-39a6721212d9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin:0; background:#F7F6F3; color:#191B1A; font-family:'Instrument Sans',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }\n  a { color:#1F4C41; text-decoration:none; border-bottom:1px solid #C9D6D1; }\n  a:hover { color:#2E6B52; border-bottom-color:#2E6B52; }\n  * { box-sizing:border-box; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:1240px;margin:0 auto;padding:0 40px 120px\">\n\n<section data-screen-label=\"01 Cover\" style=\"padding:120px 0 96px\">\n  <div style=\"display:flex;align-items:center;gap:18px;margin-bottom:56px\">\n    <svg sc-camel-view-box=\"0 0 66 66\" width=\"44\" height=\"44\" style=\"color:#1F4C41\" aria-label=\"Fortuna symbol\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"9\"><path d=\"M22 10V56\"><\u002Fpath><path d=\"M17.5 10H54\"><\u002Fpath><path d=\"M8 33H46\"><\u002Fpath><\u002Fg><\u002Fsvg>\n    <span style=\"font-family:Spectral,Georgia,serif;font-weight:400;font-size:40px;letter-spacing:0.16em;text-transform:uppercase;color:#191B1A\">Fortuna<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"font:500 12px/1 'Instrument Sans';letter-spacing:0.16em;text-transform:uppercase;color:#8B8F8C;margin-bottom:24px\">Brand identity system · Version 1.0<\u002Fdiv>\n  <h1 style=\"font-family:Spectral,Georgia,serif;font-weight:300;font-size:clamp(40px,6vw,76px);line-height:1.06;letter-spacing:-0.015em;margin:0 0 28px;max-width:900px;text-wrap:pretty\">A private financial operating system for one person.<\u002Fh1>\n  <p style=\"font-size:20px;line-height:1.6;color:#5C605E;max-width:640px;margin:0 0 48px;text-wrap:pretty\">Fortuna brings banking, spending, recurring payments, forecasting, investments, assets and liabilities into a single instrument. This document defines how it looks, reads and behaves.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:#E3E0D9;border:1px solid #E3E0D9\">\n    <sc-for list=\"{{ contents }}\" as=\"c\" hint-placeholder-count=\"6\">\n      <div style=\"background:#FFFFFF;padding:20px 18px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#9A7B4F;margin-bottom:8px\">{{ c.no }}<\u002Fdiv>\n        <div style=\"font-size:14px;font-weight:500;color:#191B1A\">{{ c.label }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"02 Concept\" style=\"padding:80px 0;border-top:1px solid #E3E0D9\">\n  <div style=\"font:500 12px/1 'Instrument Sans';letter-spacing:0.16em;text-transform:uppercase;color:#8B8F8C;margin-bottom:32px\">01 &nbsp;/&nbsp; Concept and rationale<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:48px\">\n    <div>\n      <h2 style=\"font-family:Spectral,Georgia,serif;font-weight:400;font-size:32px;line-height:1.2;margin:0 0 20px\">Fortune, held steady<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.7;color:#5C605E;margin:0 0 16px;text-wrap:pretty\">Fortuna names both wealth and the classical figure of changing circumstance. The product exists because circumstance changes: income arrives, markets move, assets age, obligations mature. Fortuna does not promise to stop the wheel. It gives one person an accurate, calm view of where they stand while it turns.<\u002Fp>\n      <p style=\"font-size:16px;line-height:1.7;color:#5C605E;margin:0;text-wrap:pretty\">The identity is therefore built on instruments rather than iconography: a precise monoline mark, a measured type system, a restrained palette drawn from paper, ink and deep cypress. Nothing celebrates. Everything reports.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <h2 style=\"font-family:Spectral,Georgia,serif;font-weight:400;font-size:32px;line-height:1.2;margin:0 0 20px\">Principles<\u002Fh2>\n      <div style=\"display:grid;gap:1px;background:#E3E0D9;border:1px solid #E3E0D9\">\n        <sc-for list=\"{{ principles }}\" as=\"p\" hint-placeholder-count=\"5\">\n          <div style=\"background:#FFFFFF;padding:18px 20px;display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:baseline\">\n            <div style=\"font-size:14px;font-weight:600;color:#191B1A\">{{ p.title }}<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.6;color:#5C605E\">{{ p.body }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"03 Logo\" style=\"padding:80px 0;border-top:1px solid #E3E0D9\">\n  <div style=\"font:500 12px/1 'Instrument Sans';letter-spacing:0.16em;text-transform:uppercase;color:#8B8F8C;margin-bottom:32px\">02 &nbsp;/&nbsp; Logo<\u002Fdiv>\n  <h2 style=\"font-family:Spectral,Georgia,serif;font-weight:400;font-size:32px;line-height:1.2;margin:0 0 12px\">The Crossbar F<\u002Fh2>\n  <p style=\"font-size:16px;line-height:1.7;color:#5C605E;max-width:620px;margin:0 0 40px;text-wrap:pretty\">An F whose lower arm is carried straight through the stem, the way European currency glyphs are barred. It reads as a letter and as a monetary sign at once, and the crossing sits at the optical centre, acting as a fulcrum: two arms, one balance point. Drawn on a 66-unit grid at a constant 9-unit stroke, entirely straight lines, butt caps, no curves to soften at small sizes. It holds at 16 pixels.<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px;margin-bottom:24px\">\n    <div style=\"background:#FFFFFF;border:1px solid #E3E0D9;padding:44px 40px\">\n      <div style=\"font:500 11px/1 'Instrument Sans';letter-spacing:0.14em;text-transform:uppercase;color:#8B8F8C;margin-bottom:36px\">Primary logo · horizontal lockup<\u002Fdiv>\n      <div id=\"fortuna-lockup-light\" style=\"display:flex;align-items:center;gap:16px;padding:8px 0\">\n        <svg sc-camel-view-box=\"0 0 66 66\" width=\"40\" height=\"40\" style=\"color:#1F4C41;flex:none\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"9\"><path d=\"M22 10V56\"><\u002Fpath><path d=\"M17.5 10H54\"><\u002Fpath><path d=\"M8 33H46\"><\u002Fpath><\u002Fg><\u002Fsvg>\n        <span style=\"font-family:Spectral,Georgia,serif;font-weight:400;font-size:34px;letter-spacing:0.16em;text-transform:uppercase;color:#191B1A;line-height:1\">Fortuna<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#101211;border:1px solid #2A2F2D;padding:44px 40px\">\n      <div style=\"font:500 11px/1 'Instrument Sans';letter-spacing:0.14em;text-transform:uppercase;color:#71766F;margin-bottom:36px\">Dark environment<\u002Fdiv>\n      <div id=\"fortuna-lockup-dark\" style=\"display:flex;align-items:center;gap:16px;padding:8px 0\">\n        <svg sc-camel-view-box=\"0 0 66 66\" width=\"40\" height=\"40\" style=\"color:#6FA697;flex:none\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"9\"><path d=\"M22 10V56\"><\u002Fpath><path d=\"M17.5 10H54\"><\u002Fpath><path d=\"M8 33H46\"><\u002Fpath><\u002Fg><\u002Fsvg>\n        <span style=\"font-family:Spectral,Georgia,serif;font-weight:400;font-size:34px;letter-spacing:0.16em;text-transform:uppercase;color:#F2EFE8;line-height:1\">Fortuna<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:24px;margin-bottom:40px\">\n    <div style=\"background:#FFFFFF;border:1px solid #E3E0D9;padding:36px 32px;display:flex;flex-direction:column;gap:28px\">\n      <div style=\"font:500 11px/1 'Instrument Sans';letter-spacing:0.14em;text-transform:uppercase;color:#8B8F8C\">Secondary · stacked<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:14px\">\n        <svg sc-camel-view-box=\"0 0 66 66\" width=\"42\" height=\"42\" style=\"color:#1F4C41\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"9\"><path d=\"M22 10V56\"><\u002Fpath><path d=\"M17.5 10H54\"><\u002Fpath><path d=\"M8 33H46\"><\u002Fpath><\u002Fg><\u002Fsvg>\n        <span style=\"font-family:Spectral,Georgia,serif;font-size:24px;letter-spacing:0.18em;text-transform:uppercase;color:#191B1A;line-height:1\">Fortuna<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border:1px solid #E3E0D9;padding:36px 32px;display:flex;flex-direction:column;gap:28px\">\n      <div style=\"font:500 11px/1 'Instrument Sans';letter-spacing:0.14em;text-transform:uppercase;color:#8B8F8C\">Symbol<\u002Fdiv>\n      <div id=\"fortuna-symbol-light\" style=\"padding:4px\">\n        <svg sc-camel-view-box=\"0 0 66 66\" width=\"72\" height=\"72\" style=\"color:#1F4C41;display:block\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"9\"><path d=\"M22 10V56\"><\u002Fpath><path d=\"M17.5 10H54\"><\u002Fpath><path d=\"M8 33H46\"><\u002Fpath><\u002Fg><\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border:1px solid #E3E0D9;padding:36px 32px;display:flex;flex-direction:column;gap:28px\">\n      <div style=\"font:500 11px/1 'Instrument Sans';letter-spacing:0.14em;text-transform:uppercase;color:#8B8F8C\">Wordmark<\u002Fdiv>\n      <div id=\"fortuna-wordmark-light\" style=\"padding:4px 0\">\n        <span style=\"font-family:Spectral,Georgia,serif;font-size:30px;letter-spacing:0.16em;text-transform:uppercase;color:#191B1A;line-height:1\">Fortuna<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border:1px solid #E3E0D9;padding:36px 32px;display:flex;flex-direction:column;gap:28px\">\n      <div style=\"font:500 11px/1 'Instrument Sans';letter-spacing:0.14em;text-transform:uppercase;color:#8B8F8C\">Monochrome<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:24px\">\n        <svg sc-camel-view-box=\"0 0 66 66\" width=\"44\" height=\"44\" style=\"color:#191B1A\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"9\"><path d=\"M22 10V56\"><\u002Fpath><path d=\"M17.5 10H54\"><\u002Fpath><path d=\"M8 33H46\"><\u002Fpath><\u002Fg><\u002Fsvg>\n        <div style=\"background:#191B1A;padding:12px\">\n          <svg sc-camel-view-box=\"0 0 66 66\" width=\"44\" height=\"44\" style=\"color:#FFFFFF;display:block\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"9\"><path d=\"M22 10V56\"><\u002Fpath><path d=\"M17.5 10H54\"><\u002Fpath><path d=\"M8 33H46\"><\u002Fpath><\u002Fg><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px\">\n    <div style=\"background:#FFFFFF;border:1px solid #E3E0D9;padding:32px\">\n      <div style=\"font:500 11px/1 'Instrument Sans';letter-spacing:0.14em;text-transform:uppercase;color:#8B8F8C;margin-bottom:24px\">Construction and clear space<\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:32px\">\n        <div style=\"position:relative;width:180px;height:180px;background:#F7F6F3;outline:1px dashed #C6C2B8;outline-offset:-22px\">\n          <svg sc-camel-view-box=\"0 0 66 66\" width=\"136\" height=\"136\" style=\"color:#1F4C41;position:absolute;left:22px;top:22px\"><g fill=\"none\" stroke=\"#C9D6D1\" stroke-width=\"0.5\"><path d=\"M8 0V66\"><\u002Fpath><path d=\"M22 0V66\"><\u002Fpath><path d=\"M46 0V66\"><\u002Fpath><path d=\"M54 0V66\"><\u002Fpath><path d=\"M0 10H66\"><\u002Fpath><path d=\"M0 33H66\"><\u002Fpath><path d=\"M0 56H66\"><\u002Fpath><\u002Fg><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"9\"><path d=\"M22 10V56\"><\u002Fpath><path d=\"M17.5 10H54\"><\u002Fpath><path d=\"M8 33H46\"><\u002Fpath><\u002Fg><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.7;color:#5C605E;max-width:240px\">Guides fall on the stem at 22, the arm ends at 46 and 54, the bar start at 8, and the three horizontals at 10, 33 and 56. Clear space on all sides equals the stroke width × 1.5 (the dashed frame). Stroke weight never changes relative to the mark. Never re-letter, outline, rotate or add effects.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border:1px solid #E3E0D9;padding:32px\">\n      <div style=\"font:500 11px/1 'Instrument Sans';letter-spacing:0.14em;text-transform:uppercase;color:#8B8F8C;margin-bottom:24px\">Minimum sizes<\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:28px;margin-bottom:24px\">\n        <sc-for list=\"{{ sizes }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px\">\n            <svg sc-camel-view-box=\"0 0 66 66\" width=\"{{ s.px }}\" height=\"{{ s.px }}\" style=\"color:#1F4C41\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"9\"><path d=\"M22 10V56\"><\u002Fpath><path d=\"M17.5 10H54\"><\u002Fpath><path d=\"M8 33H46\"><\u002Fpath><\u002Fg><\u002Fsvg>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#8B8F8C\">{{ s.label }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.7;color:#5C605E\">The symbol is cleared for use down to 16×16. Below 20×20 use the symbol alone: the wordmark requires 96px of width to stay legible.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"04 App icon\" style=\"padding:80px 0;border-top:1px solid #E3E0D9\">\n  <div style=\"font:500 12px/1 'Instrument Sans';letter-spacing:0.16em;text-transform:uppercase;color:#8B8F8C;margin-bottom:32px\">03 &nbsp;/&nbsp; App icon and favicon<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px\">\n    <div style=\"background:#FFFFFF;border:1px solid #E3E0D9;padding:32px\">\n      <div style=\"font:500 11px/1 'Instrument Sans';letter-spacing:0.14em;text-transform:uppercase;color:#8B8F8C;margin-bottom:28px\">macOS / iOS · primary<\u002Fdiv>\n      <div id=\"fortuna-appicon\" style=\"width:132px;height:132px;border-radius:29px;background:linear-gradient(180deg,#24594C 0%,#173A32 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(23,52,47,0.28)\">\n        <svg sc-camel-view-box=\"0 0 66 66\" width=\"80\" height=\"80\" style=\"color:#F2EFE8\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"9\"><path d=\"M22 10V56\"><\u002Fpath><path d=\"M17.5 10H54\"><\u002Fpath><path d=\"M8 33H46\"><\u002Fpath><\u002Fg><\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border:1px solid #E3E0D9;padding:32px\">\n      <div style=\"font:500 11px/1 'Instrument Sans';letter-spacing:0.14em;text-transform:uppercase;color:#8B8F8C;margin-bottom:28px\">Light &amp; monochrome grounds<\u002Fdiv>\n      <div style=\"display:flex;gap:16px\">\n        <div style=\"width:84px;height:84px;border-radius:19px;background:#F2EFE8;border:1px solid #E3E0D9;display:flex;align-items:center;justify-content:center\"><svg sc-camel-view-box=\"0 0 66 66\" width=\"52\" height=\"52\" style=\"color:#1F4C41\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"9\"><path d=\"M22 10V56\"><\u002Fpath><path d=\"M17.5 10H54\"><\u002Fpath><path d=\"M8 33H46\"><\u002Fpath><\u002Fg><\u002Fsvg><\u002Fdiv>\n        <div style=\"width:84px;height:84px;border-radius:19px;background:#191B1A;display:flex;align-items:center;justify-content:center\"><svg sc-camel-view-box=\"0 0 66 66\" width=\"52\" height=\"52\" style=\"color:#F2EFE8\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"9\"><path d=\"M22 10V56\"><\u002Fpath><path d=\"M17.5 10H54\"><\u002Fpath><path d=\"M8 33H46\"><\u002Fpath><\u002Fg><\u002Fsvg><\u002Fdiv>\n        <div style=\"width:84px;height:84px;border-radius:19px;background:#9A7B4F;display:flex;align-items:center;justify-content:center\"><svg sc-camel-view-box=\"0 0 66 66\" width=\"52\" height=\"52\" style=\"color:#F7F6F3\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"9\"><path d=\"M22 10V56\"><\u002Fpath><path d=\"M17.5 10H54\"><\u002Fpath><path d=\"M8 33H46\"><\u002Fpath><\u002Fg><\u002Fsvg><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FFFFFF;border:1px solid #E3E0D9;padding:32px\">\n      <div style=\"font:500 11px/1 'Instrument Sans';letter-spacing:0.14em;text-transform:uppercase;color:#8B8F8C;margin-bottom:28px\">Favicon · in situ<\u002Fdiv>\n      <div style=\"background:#E9E7E1;border-radius:8px 8px 0 0;padding:10px 10px 0\">\n        <div style=\"background:#FFFFFF;border-radius:7px 7px 0 0;padding:9px 12px;display:flex;align-items:center;gap:9px;width:208px\">\n          <div style=\"width:16px;height:16px;border-radius:4px;background:#1F4C41;display:flex;align-items:center;justify-content:center;flex:none\"><svg sc-camel-view-box=\"0 0 66 66\" width=\"11\" height=\"11\" style=\"color:#F2EFE8;display:block\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"10\"><path d=\"M22 10V56\"><\u002Fpath><path d=\"M17.5 10H54\"><\u002Fpath><path d=\"M8 33H46\"><\u002Fpath><\u002Fg><\u002Fsvg><\u002Fdiv>\n          <span style=\"font-size:12px;color:#5C605E;white-space:nowrap\">Fortuna — Net worth<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.7;color:#5C605E;margin-top:20px\">At favicon sizes the stroke widens to 9 units and the container radius drops to 25% to keep the arc open.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"05 Color\" style=\"padding:80px 0;border-top:1px solid #E3E0D9\">\n  <div style=\"font:500 12px/1 'Instrument Sans';letter-spacing:0.16em;text-transform:uppercase;color:#8B8F8C;margin-bottom:32px\">04 &nbsp;/&nbsp; Color system<\u002Fdiv>\n  <h2 style=\"font-family:Spectral,Georgia,serif;font-weight:400;font-size:32px;line-height:1.2;margin:0 0 12px\">Paper, ink, cypress<\u002Fh2>\n  <p style=\"font-size:16px;line-height:1.7;color:#5C605E;max-width:620px;margin:0 0 40px;text-wrap:pretty\">One brand hue, one metal accent used at under five percent coverage, and a warm neutral ramp. Financial states are desaturated on purpose: a loss should be legible, not loud. All text pairings meet 4.5:1 against their own surface.<\u002Fp>\n\n  <div style=\"font:500 11px/1 'Instrument Sans';letter-spacing:0.14em;text-transform:uppercase;color:#8B8F8C;margin-bottom:16px\">Brand<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:48px\">\n    <sc-for list=\"{{ brandColors }}\" as=\"c\" hint-placeholder-count=\"4\">\n      <div style=\"border:1px solid #E3E0D9;background:#FFFFFF\">\n        <div style=\"height:96px;background:{{ c.hex }}\"><\u002Fdiv>\n        <div style=\"padding:14px 14px 16px\">\n          <div style=\"font-size:13px;font-weight:600;margin-bottom:4px\">{{ c.name }}<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8B8F8C;margin-bottom:8px\">{{ c.hex }}<\u002Fdiv>\n          <div style=\"font-size:12px;line-height:1.5;color:#5C605E\">{{ c.use }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px;margin-bottom:48px\">\n    <div style=\"border:1px solid #E3E0D9;background:#FFFFFF;padding:28px\">\n      <div style=\"font:500 11px/1 'Instrument Sans';letter-spacing:0.14em;text-transform:uppercase;color:#8B8F8C;margin-bottom:20px\">Light theme tokens<\u002Fdiv>\n      <sc-for list=\"{{ lightTokens }}\" as=\"t\" hint-placeholder-count=\"10\">\n        <div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid #F0EEE9\">\n          <div style=\"width:26px;height:26px;border:1px solid rgba(0,0,0,0.10);background:{{ t.hex }};flex:none\"><\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#5C605E;flex:1;min-width:0\">{{ t.token }}<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#8B8F8C\">{{ t.hex }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #2A2F2D;background:#101211;padding:28px\">\n      <div style=\"font:500 11px/1 'Instrument Sans';letter-spacing:0.14em;text-transform:uppercase;color:#8B908A;margin-bottom:20px\">Dark theme tokens<\u002Fdiv>\n      <sc-for list=\"{{ darkTokens }}\" as=\"t\" hint-placeholder-count=\"10\">\n        <div style=\"display:flex;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid #222624\">\n          <div style=\"width:26px;height:26px;border:1px solid rgba(255,255,255,0.14);background:{{ t.hex }};flex:none\"><\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#C2C6C2;flex:1;min-width:0\">{{ t.token }}<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#8B908A\">{{ t.hex }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px\">\n    <div style=\"border:1px solid #E3E0D9;background:#FFFFFF;padding:28px\">\n      <div style=\"font:500 11px/1 'Instrument Sans';letter-spacing:0.14em;text-transform:uppercase;color:#8B8F8C;margin-bottom:20px\">Financial states<\u002Fdiv>\n      <div style=\"display:grid;gap:14px\">\n        <sc-for list=\"{{ states }}\" as=\"s\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;background:{{ s.bg }};border:1px solid {{ s.border }}\">\n            <span style=\"font-size:13px;font-weight:500;color:{{ s.fg }}\">{{ s.name }}<\u002Fspan>\n            <span style=\"font-family:'Instrument Sans';font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;color:{{ s.fg }}\">{{ s.value }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E3E0D9;background:#FFFFFF;padding:28px\">\n      <div style=\"font:500 11px/1 'Instrument Sans';letter-spacing:0.14em;text-transform:uppercase;color:#8B8F8C;margin-bottom:20px\">Chart palette &amp; neutrals<\u002Fdiv>\n      <div style=\"display:flex;height:52px;margin-bottom:18px\">\n        <sc-for list=\"{{ chartColors }}\" as=\"c\" hint-placeholder-count=\"7\">\n          <div style=\"flex:1;background:{{ c.hex }}\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:7px;margin-bottom:20px\">\n        <sc-for list=\"{{ chartColors }}\" as=\"c\" hint-placeholder-count=\"7\">\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <div style=\"width:10px;height:10px;background:{{ c.hex }};flex:none\"><\u002Fdiv>\n            <span style=\"font-size:12px;color:#5C605E;flex:1\">{{ c.name }}<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8B8F8C\">{{ c.hex }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;height:28px\">\n        <div style=\"flex:1;background:#EFEDE8\"><\u002Fdiv><div style=\"flex:1;background:#DCD9D2\"><\u002Fdiv><div style=\"flex:1;background:#C6C2B8\"><\u002Fdiv><div style=\"flex:1;background:#A8A49A\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px;color:#8B8F8C;margin-top:10px;font-family:'IBM Plex Mono',monospace\">grid / axis / inactive series neutrals<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"06 Typography\" style=\"padding:80px 0;border-top:1px solid #E3E0D9\">\n  <div style=\"font:500 12px/1 'Instrument Sans';letter-spacing:0.16em;text-transform:uppercase;color:#8B8F8C;margin-bottom:32px\">05 &nbsp;/&nbsp; Typography<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;margin-bottom:32px\">\n    <div style=\"border:1px solid #E3E0D9;background:#FFFFFF;padding:32px\">\n      <div style=\"font-family:Spectral,Georgia,serif;font-size:64px;line-height:1;margin-bottom:20px\">Aa<\u002Fdiv>\n      <div style=\"font-size:18px;font-weight:600;margin-bottom:6px\">Spectral<\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.6;color:#5C605E\">Display and editorial voice. Used for the wordmark, page titles and long-form brand copy. Weights 300–500. Open source, SIL OFL — Production Type via Google Fonts.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E3E0D9;background:#FFFFFF;padding:32px\">\n      <div style=\"font-size:64px;font-weight:500;line-height:1;margin-bottom:20px\">Aa<\u002Fdiv>\n      <div style=\"font-size:18px;font-weight:600;margin-bottom:6px\">Instrument Sans<\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.6;color:#5C605E\">Primary UI typeface and default for all financial figures with <span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px\">font-variant-numeric: tabular-nums<\u002Fspan>. Weights 400/500/600. Open source, SIL OFL.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E3E0D9;background:#FFFFFF;padding:32px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:64px;line-height:1;margin-bottom:20px\">Aa<\u002Fdiv>\n      <div style=\"font-size:18px;font-weight:600;margin-bottom:6px\">IBM Plex Mono<\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.6;color:#5C605E\">Ledger detail: IBANs, reference numbers, token names, timestamps, transaction IDs. Never for headline amounts. Open source, SIL OFL.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border:1px solid #E3E0D9;background:#FFFFFF;padding:40px;margin-bottom:24px\">\n    <div style=\"font:500 11px/1 'Instrument Sans';letter-spacing:0.14em;text-transform:uppercase;color:#8B8F8C;margin-bottom:28px\">Numeric specimen · tabular, lining<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:32px;font-variant-numeric:tabular-nums\">\n      <div>\n        <div style=\"font-size:56px;font-weight:600;letter-spacing:-0.02em;line-height:1.05\">€126,483.17<\u002Fdiv>\n        <div style=\"font-size:12px;color:#8B8F8C;margin-top:10px;font-family:'IBM Plex Mono',monospace\">display / 56 / 600 / -2%<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:14px;align-content:start\">\n        <div style=\"font-size:28px;font-weight:600;color:#2E6B52\">+€4,285.32<\u002Fdiv>\n        <div style=\"font-size:28px;font-weight:600;color:#8F3B33\">−€781.49<\u002Fdiv>\n        <div style=\"font-size:28px;font-weight:600;color:#191B1A\">37.4%<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:10px;align-content:start\">\n        <div style=\"font-size:22px;font-weight:500\">€2.814 spent this month<\u002Fdiv>\n        <div style=\"font-size:22px;font-weight:500\">€126.483 total net worth<\u002Fdiv>\n        <div style=\"font-size:12px;color:#8B8F8C;font-family:'IBM Plex Mono',monospace;margin-top:6px\">de-DE grouping supported<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border:1px solid #E3E0D9;background:#FFFFFF;padding:0\">\n    <div style=\"padding:28px 32px 0;font:500 11px/1 'Instrument Sans';letter-spacing:0.14em;text-transform:uppercase;color:#8B8F8C\">Scale<\u002Fdiv>\n    <div style=\"padding:20px 32px 32px\">\n      <sc-for list=\"{{ typeScale }}\" as=\"t\" hint-placeholder-count=\"8\">\n        <div style=\"display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:baseline;padding:16px 0;border-bottom:1px solid #F0EEE9\">\n          <div style=\"font-family:{{ t.family }};font-size:{{ t.size }};font-weight:{{ t.weight }};letter-spacing:{{ t.ls }};text-transform:{{ t.tt }};color:#191B1A;line-height:1.2;min-width:0;overflow:hidden;text-overflow:ellipsis\">{{ t.sample }}<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#8B8F8C\">{{ t.spec }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"07 Layout\" style=\"padding:80px 0;border-top:1px solid #E3E0D9\">\n  <div style=\"font:500 12px/1 'Instrument Sans';letter-spacing:0.16em;text-transform:uppercase;color:#8B8F8C;margin-bottom:32px\">06 &nbsp;/&nbsp; Spacing, layout, icons, data<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px\">\n    <div style=\"border:1px solid #E3E0D9;background:#FFFFFF;padding:28px\">\n      <div style=\"font-size:16px;font-weight:600;margin-bottom:16px\">4pt spine<\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:8px;margin-bottom:18px\">\n        <sc-for list=\"{{ spacing }}\" as=\"s\" hint-placeholder-count=\"7\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:8px\">\n            <div style=\"width:22px;height:{{ s.px }}px;background:#1F4C41\"><\u002Fdiv>\n            <span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;color:#8B8F8C\">{{ s.px }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.7;color:#5C605E\">Steps of 4, 8, 12, 16, 24, 32, 48, 64. Card padding 20–24, section gaps 24, page gutters 32 desktop / 20 mobile. Radii: 2 for inputs and cards, 8 for sheets, 0 for tables. Borders 1px, never shadows for hierarchy — only for true overlays.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E3E0D9;background:#FFFFFF;padding:28px\">\n      <div style=\"font-size:16px;font-weight:600;margin-bottom:16px\">Icon style<\u002Fdiv>\n      <div style=\"display:flex;gap:18px;margin-bottom:18px;color:#1F4C41\">\n        <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><rect x=\"3\" y=\"6\" width=\"18\" height=\"13\"><\u002Frect><path d=\"M3 10h18\"><\u002Fpath><\u002Fsvg>\n        <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M4 19V9M10 19V5M16 19v-7M22 19H2\"><\u002Fpath><\u002Fsvg>\n        <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><circle cx=\"12\" cy=\"12\" r=\"8\"><\u002Fcircle><path d=\"M12 8v8M9 11h6\"><\u002Fpath><\u002Fsvg>\n        <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M3 17l6-6 4 3 7-7\"><\u002Fpath><path d=\"M16 7h4v4\"><\u002Fpath><\u002Fsvg>\n        <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M4 20V8l8-4 8 4v12\"><\u002Fpath><path d=\"M9 20v-6h6v6\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;line-height:1.7;color:#5C605E\">24×24 box, 1.5px monoline, butt caps, miter joins, no fills, no duotone, no rounded corners beyond 1px. Geometry matches the logo grid. Icons are labels, not decoration: one per row maximum.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #E3E0D9;background:#FFFFFF;padding:28px\">\n      <div style=\"font-size:16px;font-weight:600;marg
